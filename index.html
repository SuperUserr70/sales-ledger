:root{
  --bg:#F7F3E8; --ink:#2B2A1F; --ink-soft:#5A5847;

    --bg:#1C1B14; --ink:#EDE8D8; --ink-soft:#B9B49C;
    --olive:#8FA365; --olive-dark:#AEC17E;

}
